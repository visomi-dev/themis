packages:
  - 'apps/**'
  - 'libs/**'

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  less: true
  lmdb: true
  msgpackr-extract: true
  nx: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - astro-eslint-parser@2.0.0
  - bullmq@5.79.1
  - eslint-plugin-astro@2.0.0
