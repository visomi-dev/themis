packages:
  - 'apps/**'
  - 'libs/**'

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  less: true
  lmdb: true
  msgpackr-extract: true
  nx: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@angular/aria@22.1.2'
  - '@angular/cdk@22.1.2'
  - astro-eslint-parser@2.0.0
  - bullmq@5.79.1
  - eslint-plugin-astro@2.0.0
  - '@earendil-works/pi-tui@0.84.2'

overrides:
  '@electric-sql/pglite': 0.5.3
  drizzle-orm: 1.0.0-beta.21
  ioredis: 5.11.1
  pg: 8.22.0
