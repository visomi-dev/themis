<app-container size="sm">
  <div class="flex flex-col gap-8 py-4">
    <header>
      <div class="flex items-center gap-3 text-sm">
        <app-link i18n="@@projectNewBreadcrumb" [routerLink]="projectsUrl" [text]="'Projects'" />
        <span class="text-outline-variant">/</span>
        <span class="text-zinc-500 dark:text-zinc-400" i18n="@@projectNewBreadcrumbCurrent">New project</span>
      </div>

      <app-heading class="mt-6" i18n="@@projectNewTitle" level="1" [text]="'New project'" />
    </header>

    @if (errorMessage()) {
      <app-alert tone="danger">{{ errorMessage() }}</app-alert>
    }

    <app-card padding="md" tone="raised">
      <app-form class="grid gap-6" [form]="newProjectForm">
        <app-field>
          <app-label for="project-name" i18n="@@projectNewNameLabel">Project name</app-label>
          <app-input
            [formField]="newProjectForm.name"
            required
            maxLength="120"
            controlId="project-name"
            name="name"
            placeholder="My application"
            type="text"
          />
          <app-error-message controlId="project-name-error" i18n="@@projectNewNameRequiredError">{{
            nameError()
          }}</app-error-message>
        </app-field>

        <app-field>
          <app-label for="project-summary" i18n="@@projectNewSummaryLabel">Summary</app-label>
          <app-description i18n="@@projectNewSummaryHelp"
            >A short description of the project (optional).</app-description
          >
          <app-textarea
            [formField]="newProjectForm.summary"
            maxLength="500"
            controlId="project-summary"
            name="summary"
            placeholder="A short description of the project"
            [rows]="3"
          />
          <app-error-message controlId="project-summary-error" i18n="@@projectNewSummaryError">{{
            summaryError()
          }}</app-error-message>
        </app-field>

        <div class="flex flex-col gap-3 sm:flex-row sm:justify-end">
          <app-link-button i18n="@@projectNewCancel" [routerLink]="projectsUrl" [text]="'Cancel'" variant="outline" />
          <app-button i18n="@@projectNewSubmit" tone="accent" type="submit" [loading]="submitting()">
            Create project
          </app-button>
        </div>
      </app-form>
    </app-card>
  </div>
</app-container>
