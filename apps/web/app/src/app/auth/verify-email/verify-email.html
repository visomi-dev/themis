<app-auth-layout>
  <div data-slot="brand" class="space-y-6">
    <app-logo variant="wordmark" />
    <p class="text-muted-fg text-sm" i18n="@@verifyEmailEyebrow">Verification checkpoint</p>
    <p
      class="text-muted-fg hidden text-xs font-black tracking-widest uppercase md:block"
      i18n="@@verifyEmailHeroKicker"
    >
      Verification flow
    </p>
    <app-heading
      class="hidden max-w-xl md:block"
      i18n="@@verifyEmailHeroTitle"
      level="1"
      [text]="'Confirm the email step before opening the workspace.'"
    />
  </div>

  <div class="flex justify-end gap-3 pb-6">
    <app-theme-switcher />
  </div>

  <app-card padding="lg" tone="raised">
    <p class="text-muted-fg text-xs font-black tracking-widest uppercase" i18n="@@verifyEmailPanelKicker">
      Email verification
    </p>

    <app-heading i18n="@@verifyEmailPanelTitle" level="2" [text]="'Verify email'" />

    <app-text i18n="@@verifyEmailDescription">
      Enter the verification code sent to <strong class="text-fg">{{ challenge()?.email }}</strong> to continue.
    </app-text>

    <app-verification-code-form
      [errorMessage]="errorMessage()"
      [statusMessage]="statusMessage()"
      [submitting]="verificationSubmitting()"
      (verify)="submit($event)"
      (resend)="resend()"
    />

    <app-link i18n="@@verifyEmailFooterLink" [routerLink]="signInUrl" [text]="'Start again'" />
  </app-card>
</app-auth-layout>
