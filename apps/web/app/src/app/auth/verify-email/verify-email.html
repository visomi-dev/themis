<app-auth-layout>
  <app-auth-card>
    <header class="mb-7 space-y-2">
      <p
        data-slot="kicker"
        class="text-zinc-500 dark:text-zinc-400 font-mono text-xs font-semibold tracking-widest uppercase"
        i18n="@@verifyEmailKicker"
      >
        Email verification
      </p>
      <h1
        data-slot="title"
        class="font-display text-zinc-950 dark:text-zinc-50 text-[1.625rem] leading-tight font-bold tracking-[-0.025em]"
        i18n="@@verifyEmailTitle"
      >
        Verify email
      </h1>
      <p data-slot="sub" class="text-zinc-500 dark:text-zinc-400 text-[0.9375rem] leading-6" i18n="@@verifyEmailSub">
        Enter the 6-digit code we sent.
      </p>
    </header>

    @if (challenge()?.email; as pendingEmail) {
      <div
        data-od-id="pending-email"
        class="text-zinc-500 dark:text-zinc-400 border-zinc-950/10 dark:border-white/10 bg-white dark:bg-zinc-950 mb-5 flex items-center justify-between rounded-[var(--radius-control)] border px-3 py-2 text-xs"
      >
        <span class="font-mono tracking-wide uppercase" i18n="@@verifyEmailSendingToLabel">Sending to</span>
        <span class="text-zinc-950 dark:text-zinc-50 font-mono">{{ pendingEmail }}</span>
      </div>
    }

    <app-verification-code-form
      [errorMessage]="errorMessage()"
      [statusMessage]="statusMessage()"
      [submitting]="verificationSubmitting()"
      (verify)="submit($event)"
      (resend)="resend()"
    />

    <p class="text-zinc-500 dark:text-zinc-400 mt-6 text-sm" i18n="@@verifyEmailFooterPrompt">Need to start over?</p>
    <app-link data-slot="footer" i18n="@@verifyEmailFooterLink" [routerLink]="signInUrl" [text]="'Start again'" />
  </app-auth-card>
</app-auth-layout>
