<app-auth-layout>
  <div data-slot="brand" class="space-y-6">
    <app-logo variant="wordmark" />
    <p class="text-muted-fg text-sm" i18n="@@forgottenPasswordEyebrow">AI-integrated technical access layer</p>
    <p
      class="text-muted-fg hidden text-xs font-black tracking-widest uppercase md:block"
      i18n="@@forgottenPasswordHeroKicker"
    >
      Account recovery
    </p>
    <app-heading
      class="hidden max-w-xl md:block"
      i18n="@@forgottenPasswordHeroTitle"
      level="1"
      [text]="'Recover your access.'"
    />
  </div>

  <div class="flex justify-end gap-3 pb-6">
    <app-theme-switcher />
  </div>

  <app-card padding="lg" tone="raised">
    <p class="text-muted-fg text-xs font-black tracking-widest uppercase" i18n="@@forgottenPasswordPanelKicker">
      Account access
    </p>

    <app-heading i18n="@@forgottenPasswordPanelTitle" level="2" [text]="'Reset password'" />

    @if (errorMessage()) {
      <app-alert tone="danger">{{ errorMessage() }}</app-alert>
    }
    @if (successMessage()) {
      <app-alert tone="success">{{ successMessage() }}</app-alert>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" class="grid gap-5" novalidate>
      <app-field>
        <app-label for="forgotten-password-email" i18n="@@forgottenPasswordEmailLabel">Email</app-label>
        <app-input
          autocomplete="email"
          formControlName="email"
          [controlId]="'forgotten-password-email'"
          invalid="!!emailError()"
          name="email"
          placeholder="name@organization.com"
          type="email"
          (blur)="updateEmailError()"
        />
        @if (emailError(); as message) {
          <app-error-message controlId="forgotten-password-email-error">{{ message }}</app-error-message>
        }
      </app-field>

      <app-button i18n="@@forgottenPasswordSubmitButton" tone="accent" type="submit" [loading]="submitting()">
        Send reset link
      </app-button>
    </form>

    <app-link i18n="@@forgottenPasswordFooterLink" [routerLink]="signInUrl" [text]="'Back to sign in'" />
  </app-card>
</app-auth-layout>
