<app-auth-layout>
  <div data-slot="brand" class="space-y-6">
    <app-logo variant="wordmark" />
    <app-text size="sm" tone="muted" i18n="@@signInEyebrow">AI-integrated technical access layer</app-text>
    <p class="text-muted-fg hidden text-xs font-black tracking-widest uppercase md:block" i18n="@@signInHeroKicker">
      Workspace access
    </p>
    <app-heading
      class="hidden max-w-xl md:block"
      i18n="@@signInHeroTitle"
      level="1"
      [text]="'Human and agent execution, secured.'"
    />
  </div>

  <div class="flex justify-end gap-3 pb-6">
    <app-theme-switcher />
  </div>

  <app-card padding="lg" tone="raised">
    <p class="text-muted-fg text-xs font-black tracking-widest uppercase" i18n="@@signInPanelKicker">Account access</p>

    <app-heading i18n="@@signInPanelTitle" level="2" [text]="'Sign in'" />

    @if (errorMessage()) {
      <app-alert tone="danger">{{ errorMessage() }}</app-alert>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" class="grid gap-5" novalidate>
      <app-field>
        <app-label for="sign-in-email" i18n="@@signInEmailLabel">Email</app-label>
        <app-input
          autocomplete="email"
          formControlName="email"
          [controlId]="'sign-in-email'"
          invalid="!!emailError()"
          name="email"
          placeholder="name@organization.com"
          type="email"
          (blur)="updateEmailError()"
        />
        @if (emailError(); as message) {
          <app-error-message controlId="sign-in-email-error">{{ message }}</app-error-message>
        }
      </app-field>

      <app-field>
        <div class="flex items-center justify-between gap-3">
          <app-label for="sign-in-password" i18n="@@signInPasswordLabel">Password</app-label>
          <app-link
            i18n="@@signInForgottenPasswordLink"
            [routerLink]="forgottenPasswordUrl"
            [text]="'Forgotten password?'"
          />
        </div>
        <app-password-input
          autocomplete="current-password"
          formControlName="password"
          [controlId]="'sign-in-password'"
          invalid="!!passwordError()"
          name="password"
          placeholder="***************"
          (blur)="updatePasswordError()"
        />
        @if (passwordError(); as message) {
          <app-error-message controlId="sign-in-password-error">{{ message }}</app-error-message>
        }
      </app-field>

      <label class="text-muted-fg flex items-start gap-3 text-sm leading-6" for="sign-in-remember-device">
        <app-checkbox formControlName="rememberDevice" [controlId]="'sign-in-remember-device'" name="rememberDevice" />
        <span i18n="@@signInRememberDeviceLabel">Remember this device.</span>
      </label>

      <app-button i18n="@@signInSubmitButton" tone="accent" type="submit" [loading]="submitting()">Sign in</app-button>
    </form>

    <p class="text-muted-fg mt-2 text-sm" i18n="@@signInFooterPrompt">New to Themis?</p>
    <app-link i18n="@@signInFooterLink" [routerLink]="footerLink" [text]="'Create an account'" />
  </app-card>
</app-auth-layout>
