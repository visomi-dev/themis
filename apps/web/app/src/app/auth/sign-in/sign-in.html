<app-auth-layout>
  <app-auth-card>
    <header class="mb-7 space-y-2">
      <p
        data-slot="kicker"
        class="text-zinc-500 dark:text-zinc-400 font-mono text-xs font-semibold tracking-widest uppercase"
        i18n="@@signInKicker"
      >
        Account access
      </p>
      <h1
        data-slot="title"
        class="font-display text-zinc-950 dark:text-zinc-50 text-[1.625rem] leading-tight font-bold tracking-[-0.025em]"
        i18n="@@signInTitle"
      >
        Sign in
      </h1>
      <p data-slot="sub" class="text-zinc-500 dark:text-zinc-400 text-[0.9375rem] leading-6" i18n="@@signInSub">
        Welcome back. Use your work email to access your Themis workspace.
      </p>
    </header>

    @if (errorMessage()) {
      <app-alert class="mb-5" tone="danger" variant="auth" i18n="@@signInAuthFailedAlert">{{
        errorMessage()
      }}</app-alert>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" class="grid gap-5" novalidate>
      <app-field>
        <app-label for="sign-in-email" i18n="@@signInEmailLabel">Email</app-label>
        <app-input
          autocomplete="email"
          formControlName="email"
          [controlId]="'sign-in-email'"
          [invalid]="!!emailError()"
          name="email"
          placeholder="name@organization.com"
          type="email"
          (blur)="updateEmailError()"
        />
        @if (emailError(); as message) {
          <app-error-message controlId="sign-in-email-error">{{ message }}</app-error-message>
        }
      </app-field>

      <app-field>
        <div class="flex items-center justify-between gap-3">
          <app-label for="sign-in-password" i18n="@@signInPasswordLabel">Password</app-label>
          <app-link
            i18n="@@signInForgottenPasswordLink"
            [routerLink]="forgottenPasswordUrl"
            [text]="'Forgotten password?'"
          />
        </div>
        <app-password-input
          autocomplete="current-password"
          formControlName="password"
          [controlId]="'sign-in-password'"
          [invalid]="!!passwordError()"
          name="password"
          placeholder="***************"
          (blur)="updatePasswordError()"
        />
        @if (passwordError(); as message) {
          <app-error-message controlId="sign-in-password-error">{{ message }}</app-error-message>
        }
      </app-field>

      <label class="text-zinc-500 dark:text-zinc-400 flex items-start gap-3 text-sm leading-6" for="sign-in-remember-device">
        <app-checkbox formControlName="rememberDevice" [controlId]="'sign-in-remember-device'" name="rememberDevice" />
        <span i18n="@@signInRememberDeviceLabel">Remember this device.</span>
      </label>

      <app-button data-slot="submit" i18n="@@signInSubmitButton" tone="accent" type="submit" [loading]="submitting()"
        >Sign in</app-button
      >
    </form>

    <p class="text-zinc-500 dark:text-zinc-400 mt-6 text-sm" i18n="@@signInFooterPrompt">New to Themis?</p>
    <app-link data-slot="footer" i18n="@@signInFooterLink" [routerLink]="footerLink" [text]="'Create an account'" />
  </app-auth-card>
</app-auth-layout>
