<app-auth-layout>
  <app-auth-card>
    <header class="mb-7 space-y-2">
      <p
        data-slot="kicker"
        class="font-mono text-xs font-semibold tracking-widest text-zinc-500 uppercase dark:text-zinc-400"
        i18n="@@signInKicker"
      >
        Account access
      </p>
      <h1
        data-slot="title"
        class="font-heading text-[1.625rem] leading-tight font-bold tracking-[-0.025em] text-zinc-950 dark:text-zinc-50"
        i18n="@@signInTitle"
      >
        Sign in
      </h1>
      <p data-slot="sub" class="text-[0.9375rem] leading-6 text-zinc-500 dark:text-zinc-400" i18n="@@signInSub">
        Welcome back. Use your work email to access your Themis workspace.
      </p>
    </header>

    @if (errorMessage()) {
      <app-alert class="mb-5" tone="danger" variant="auth" i18n="@@signInAuthFailedAlert">{{
        errorMessage()
      }}</app-alert>
    }

    <app-form class="grid w-full max-w-sm grid-cols-1 gap-8" [form]="signInForm">
      <app-field>
        <app-label for="sign-in-email" i18n="@@signInEmailLabel">Email</app-label>
        <app-input
          autocomplete="email"
          [formField]="signInForm.email"
          required
          type="email"
          placeholder="name@organization.com"
          controlId="sign-in-email"
          name="email"
        />
        <app-error-message controlId="sign-in-email-error" i18n="@@signInEmailErrorInvalid">{{
          emailError()
        }}</app-error-message>
      </app-field>

      <app-field>
        <app-label for="sign-in-password" i18n="@@signInPasswordLabel">Password</app-label>
        <app-password-input
          autocomplete="current-password"
          [formField]="signInForm.password"
          required
          minLength="8"
          placeholder="***************"
          controlId="sign-in-password"
          name="password"
        />
        <app-error-message controlId="sign-in-password-error" i18n="@@signInPasswordErrorMinlength">{{
          passwordError()
        }}</app-error-message>
      </app-field>

      <div class="flex items-center justify-between gap-3">
        <label
          for="sign-in-remember-device"
          class="flex items-center gap-3 text-sm leading-6 font-medium text-zinc-950 select-none dark:text-zinc-50"
        >
          <app-checkbox
            [formField]="signInForm.rememberDevice"
            controlId="sign-in-remember-device"
            name="rememberDevice"
          />
          <span i18n="@@signInRememberDeviceLabel">Remember this device.</span>
        </label>
        <app-link
          i18n="@@signInForgottenPasswordLink"
          [routerLink]="forgottenPasswordUrl"
          [text]="'Forgotten password?'"
        />
      </div>

      <app-button
        data-od-id="submit"
        data-slot="submit"
        i18n="@@signInSubmitButton"
        tone="accent"
        type="submit"
        size="lg"
        fullWidth
        [loading]="submitting()"
        >Sign in</app-button
      >

      <p class="text-center text-sm text-zinc-500 dark:text-zinc-400">
        <span i18n="@@signInFooterPrompt">New to Themis?</span>
        <app-link
          data-slot="footer"
          class="ml-2 font-semibold"
          i18n="@@signInFooterLink"
          [routerLink]="footerLink"
          [text]="'Create an account'"
        />
      </p>
    </app-form>
  </app-auth-card>
</app-auth-layout>
