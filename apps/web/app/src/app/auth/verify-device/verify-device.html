<app-auth-layout>
  <app-auth-card>
    <header class="mb-7 space-y-2">
      <p
        data-slot="kicker"
        class="font-mono text-xs font-semibold tracking-widest text-zinc-500 uppercase dark:text-zinc-400"
        i18n="@@verifyDeviceKicker"
      >
        Device verification
      </p>
      <h1
        data-slot="title"
        class="font-heading text-[1.625rem] leading-tight font-bold tracking-[-0.025em] text-zinc-950 dark:text-zinc-50"
        i18n="@@verifyDeviceTitle"
      >
        Verify device
      </h1>
      <p data-slot="sub" class="text-[0.9375rem] leading-6 text-zinc-500 dark:text-zinc-400" i18n="@@verifyDeviceSub">
        Enter the 6-digit code from your email to verify this device.
      </p>
    </header>

    <app-verification-code-form
      [errorMessage]="errorMessage()"
      [pinManualError]="pinManualError()"
      [statusMessage]="statusMessage()"
      [submitting]="verificationSubmitting()"
      (verify)="submit($event)"
      (resend)="resend()"
    />

    <div class="mt-8 flex flex-col items-center gap-2 text-center text-sm text-zinc-500 dark:text-zinc-400">
      <p i18n="@@verifyDeviceFooterPrompt">Need to start over?</p>
      <app-link data-slot="footer" i18n="@@verifyDeviceFooterLink" [routerLink]="signInUrl" [text]="'Start again'" />
    </div>
  </app-auth-card>
</app-auth-layout>
