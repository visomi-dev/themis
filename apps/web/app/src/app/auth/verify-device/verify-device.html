<app-auth-layout>
  <app-auth-card>
    <header class="mb-7 space-y-2">
      <p
        data-slot="kicker"
        class="text-zinc-500 dark:text-zinc-400 font-mono text-xs font-semibold tracking-widest uppercase"
        i18n="@@verifyDeviceKicker"
      >
        Device verification
      </p>
      <h1
        data-slot="title"
        class="font-display text-zinc-950 dark:text-zinc-50 text-[1.625rem] leading-tight font-bold tracking-[-0.025em]"
        i18n="@@verifyDeviceTitle"
      >
        Verify device
      </h1>
      <p data-slot="sub" class="text-zinc-500 dark:text-zinc-400 text-[0.9375rem] leading-6" i18n="@@verifyDeviceSub">
        Enter the 6-digit code we sent to <strong class="text-zinc-950 dark:text-zinc-50">{{ challenge()?.email }}</strong
        >.
      </p>
    </header>

    <app-verification-code-form
      [errorMessage]="errorMessage()"
      [statusMessage]="statusMessage()"
      [submitting]="verificationSubmitting()"
      (verify)="submit($event)"
      (resend)="resend()"
    />

    <p class="text-zinc-500 dark:text-zinc-400 mt-6 text-sm" i18n="@@verifyDeviceFooterPrompt">Need to start over?</p>
    <app-link data-slot="footer" i18n="@@verifyDeviceFooterLink" [routerLink]="signInUrl" [text]="'Start again'" />
  </app-auth-card>
</app-auth-layout>
