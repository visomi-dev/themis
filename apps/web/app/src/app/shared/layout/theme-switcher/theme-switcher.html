@if (isToggle()) {
  <button
    data-od-id="theme-toggle"
    class="ui-focus-ring text-fg hover:bg-surface-2 grid size-9 place-items-center rounded-[var(--radius-control)] transition-colors"
    type="button"
    aria-label="Toggle light/dark theme"
    (click)="settings.toggleTheme()"
  >
    <app-icon [name]="iconName()" class="size-4" aria-hidden="true" />
  </button>
} @else {
  <button
    class="border-outline-variant/40 bg-panel text-on-surface-variant hover:bg-surface-container-low hover:text-accent inline-flex h-10 w-10 items-center justify-center rounded-md border transition-colors"
    type="button"
    (click)="settings.toggleTheme()"
  >
    <span class="sr-only" i18n="@@themeSwitcherToggleTheme">Toggle theme</span>
    <app-icon [name]="iconName()" />
  </button>
}
