<header
  class="flex h-16 shrink-0 items-center gap-6 border-b border-zinc-950/10 bg-white px-4 lg:px-8 dark:border-white/10 dark:bg-zinc-50 dark:bg-zinc-900 dark:bg-zinc-950"
>
  <div
    class="hidden flex-1 font-sans text-lg font-semibold text-zinc-950 lg:block dark:text-zinc-50"
    i18n="@@layoutOverviewTitle"
  >
    Overview
  </div>

  <button
    type="button"
    class="flex h-9 w-9 items-center justify-center rounded-sm text-zinc-500 transition-colors hover:bg-zinc-50 hover:text-zinc-950 lg:hidden dark:bg-zinc-700 dark:bg-zinc-900 dark:text-zinc-50 dark:text-zinc-400 dark:hover:bg-zinc-200"
    aria-label="Open navigation"
    i18n-aria-label="@@layoutOpenNavigation"
    (click)="openMobileMenu.emit()"
  >
    <app-icon name="bars" />
  </button>

  <div class="relative ml-auto hidden w-70 md:block">
    <app-icon name="search" class="absolute top-1/2 left-2 -translate-y-1/2 text-sm text-zinc-500 dark:text-zinc-400" />
    <input
      class="h-9 w-full border-0 border-b border-zinc-950/10 bg-transparent pr-3 pl-9 text-sm text-zinc-950 transition-colors outline-none placeholder:text-zinc-500 focus:border-blue-600 dark:border-blue-500 dark:border-white/10 dark:text-zinc-50 dark:text-zinc-400"
      type="search"
      placeholder="Search projects, tasks..."
      i18n-placeholder="@@layoutSearchPlaceholder"
    />
  </div>

  <div class="flex items-center gap-2">
    <button
      type="button"
      class="relative flex h-9 w-9 items-center justify-center rounded-sm text-zinc-500 transition-colors hover:bg-zinc-50 hover:text-zinc-950 dark:bg-zinc-700 dark:bg-zinc-900 dark:text-zinc-50 dark:text-zinc-400 dark:hover:bg-zinc-200"
      aria-label="Notifications"
      i18n-aria-label="@@layoutNotifications"
    >
      <app-icon name="bell" />
      <span
        class="absolute top-1.5 right-1.5 h-2 w-2 rounded-full border border-white bg-amber-600 dark:border-zinc-950 dark:bg-amber-500"
      ></span>
    </button>
    <button
      type="button"
      class="flex h-9 w-9 items-center justify-center rounded-sm text-zinc-500 transition-colors hover:bg-zinc-50 hover:text-zinc-950 dark:bg-zinc-700 dark:bg-zinc-900 dark:text-zinc-50 dark:text-zinc-400 dark:hover:bg-zinc-200"
      aria-label="Help"
      i18n-aria-label="@@layoutHelp"
    >
      <app-icon name="question-circle" />
    </button>
    <button
      type="button"
      class="flex h-9 w-9 items-center justify-center rounded-sm text-zinc-500 transition-colors hover:bg-zinc-50 hover:text-zinc-950 dark:bg-zinc-700 dark:bg-zinc-900 dark:text-zinc-50 dark:text-zinc-400 dark:hover:bg-zinc-200"
      (click)="toggleTheme()"
    >
      <span class="sr-only" i18n="@@themeSwitcherToggleTheme">Toggle theme</span>
      <app-icon [name]="isDark() ? 'sun' : 'moon'" />
    </button>
    <app-language-switcher />
  </div>
</header>
