<app-dropdown>
  <button
    data-slot="trigger"
    type="button"
    class="text-zinc-500 dark:text-zinc-400 hover:bg-zinc-50 dark:bg-zinc-900 hover:text-zinc-950 dark:text-zinc-50 dark:hover:bg-zinc-200 dark:bg-zinc-700 flex h-9 items-center gap-2 rounded-sm px-3 text-xs font-black tracking-widest uppercase transition-colors"
    aria-label="Change language"
    i18n-aria-label="@@languageSwitcherChangeLanguage"
  >
    <app-icon name="globe" />
    <span>{{ currentLocaleLabel() }}</span>
    <app-icon name="angle-down" class="text-xs" />
  </button>

  <div class="ui-panel-raised min-w-40 p-1" role="menu">
    <a
      class="ui-focus-ring text-zinc-950 dark:text-zinc-50 hover:bg-zinc-50 dark:bg-zinc-900 flex items-center rounded-[var(--radius-control)] px-3 py-2 text-sm"
      [routerLink]="localeUrl('en')"
      role="menuitem"
    >
      <span i18n="@@languageSwitcherEnglishOption">English</span>
    </a>
    <a
      class="ui-focus-ring text-zinc-950 dark:text-zinc-50 hover:bg-zinc-50 dark:bg-zinc-900 flex items-center rounded-[var(--radius-control)] px-3 py-2 text-sm"
      [routerLink]="localeUrl('es')"
      role="menuitem"
    >
      <span i18n="@@languageSwitcherSpanishOption">Spanish</span>
    </a>
  </div>
</app-dropdown>
