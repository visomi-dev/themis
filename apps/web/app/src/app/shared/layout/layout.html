@if (showAppShell()) {
  <div class="bg-white dark:bg-zinc-950 text-zinc-950 dark:text-zinc-50 flex min-h-dvh">
    <app-sidebar-menu
      [collapsed]="sidebarCollapsed()"
      [mobileMenuOpen]="mobileMenuOpen()"
      (closed)="closeMobileMenu()"
      (toggleCollapsed)="toggleSidebarCollapsed()"
    />

    <section class="flex min-w-0 flex-1 flex-col">
      <app-topbar (openMobileMenu)="openMobileMenu()" />

      <main class="bg-white dark:bg-zinc-950 dark:bg-zinc-50 dark:bg-zinc-900 max-h-dvh min-w-0 flex-1 overflow-y-auto p-8">
        <router-outlet />
      </main>
    </section>
  </div>
} @else {
  <router-outlet />
}
