<details data-od-id="lang-menu" class="relative" [attr.open]="open() ? '' : null">
  <summary
    class="ui-focus-ring text-fg hover:bg-surface-2 inline-flex cursor-pointer list-none items-center gap-1.5 rounded-[var(--radius-control)] px-3 py-2 font-mono text-xs font-medium tracking-wide transition-colors"
    aria-label="Language"
    tabindex="0"
    (click)="$event.preventDefault(); toggle()"
    (keydown.enter)="$event.preventDefault(); toggle()"
    (keydown.space)="$event.preventDefault(); toggle()"
    (keyup.escape)="close()"
  >
    <span class="font-semibold">{{ labelFor() }}</span>
    <app-icon name="angle-down" class="size-3 opacity-60" aria-hidden="true" />
  </summary>
  <ul
    class="bg-panel border-outline-variant/40 absolute top-full right-0 z-20 mt-1 min-w-[12rem] rounded-[var(--radius-panel)] border p-1.5 shadow-md"
    role="listbox"
  >
    @for (option of options(); track option.code) {
      <li
        class="ui-focus-ring text-fg hover:bg-surface-2 flex cursor-pointer items-center justify-between rounded-[var(--radius-control)] px-2.5 py-2 text-sm transition-colors"
        role="option"
        tabindex="0"
        [attr.data-lang]="option.code"
        [attr.aria-selected]="option.code === current() ? 'true' : 'false'"
        (click)="select(option.code)"
        (keydown.enter)="select(option.code)"
        (keydown.space)="$event.preventDefault(); select(option.code)"
      >
        <span>{{ option.label }}</span>
        <code class="text-muted-fg font-mono text-xs">{{ option.code }}</code>
      </li>
    }
  </ul>
</details>
