<header
  data-od-id="auth-shell"
  class="bg-bg border-outline-variant/40 sm:bg-bg/85 relative border-b sm:sticky sm:top-0 sm:z-20 sm:backdrop-blur-md"
>
  <div class="mx-auto flex max-w-7xl items-center justify-between gap-3 px-4 py-2.5 sm:gap-4 sm:px-6 sm:py-3">
    <a
      data-od-id="brand"
      routerLink="/"
      class="font-display text-fg inline-flex items-center gap-2 font-bold tracking-tight sm:gap-2.5"
      aria-label="Themis home"
    >
      <app-logo variant="mark-name" size="sm" />
    </a>

    <div class="flex items-center gap-1.5 sm:gap-2">
      <app-lang-switcher [options]="languages" />
      <app-theme-switcher variant="toggle" />
    </div>
  </div>
</header>

<main class="bg-bg grid min-h-[calc(100vh-64px)] place-items-center px-4 py-8 sm:py-10 md:px-6 md:py-14">
  <ng-content />
</main>
