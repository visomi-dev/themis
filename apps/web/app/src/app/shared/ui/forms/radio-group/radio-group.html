<fieldset class="grid gap-3" [disabled]="disabled() || formDisabled()">
  @if (legend()) {
    <legend class="text-fg text-sm font-semibold">{{ legend() }}</legend>
  }

  @for (option of options(); track option.value) {
    <label [class]="optionClasses()">
      <span class="flex items-start gap-3">
        <input
          class="ui-focus-ring mt-0.5 size-4 accent-[var(--color-accent)]"
          [checked]="value() === option.value"
          [name]="name()"
          [value]="option.value"
          type="radio"
          (blur)="markTouched()"
          (change)="selectValue(option.value)"
        />
        <span class="grid gap-1">
          <span class="font-medium">{{ option.label }}</span>
          @if (option.description) {
            <span class="text-muted-fg">{{ option.description }}</span>
          }
        </span>
      </span>
    </label>
  }
</fieldset>
