<textarea
  [attr.aria-describedby]="ariaDescribedBy()"
  [attr.aria-invalid]="invalid()"
  [attr.id]="controlId()"
  [attr.name]="name()"
  [class]="classes()"
  [disabled]="disabled() || formDisabled()"
  [placeholder]="placeholder()"
  [rows]="rows()"
  [value]="value()"
  data-slot="control"
  (blur)="markTouched()"
  (input)="updateValue($event)"
></textarea>
