<div class="relative">
  <input
    [attr.aria-describedby]="ariaDescribedBy()"
    [attr.aria-invalid]="invalid()"
    [attr.autocomplete]="autocomplete()"
    [attr.id]="controlId()"
    [attr.name]="name()"
    [attr.pattern]="pattern()"
    [class]="inputClasses()"
    [disabled]="disabled() || formDisabled() || loading()"
    [placeholder]="placeholder()"
    [type]="type()"
    [value]="value()"
    data-slot="control"
    minlength="8"
    maxlength="64"
    (blur)="markTouched()"
    (input)="updateValue($event)"
  />

  <button
    [class]="toggleClasses()"
    type="button"
    [attr.aria-label]="type() === 'password' ? 'Show characters' : 'Hide characters'"
    (click)="toggleType()"
  >
    <app-icon [name]="type() === 'password' ? 'eye' : 'eye-off'" />
  </button>

  @if (loading()) {
    <span
      aria-hidden="true"
      class="absolute top-1/2 right-5 size-4 -translate-y-1/2 animate-spin rounded-full border-2 border-current border-r-transparent"
    ></span>
  }
</div>
