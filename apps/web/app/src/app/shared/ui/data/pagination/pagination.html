<nav class="flex items-center justify-between gap-3" aria-label="Pagination">
  <button
    class="ui-focus-ring border-zinc-500/30 dark:border-zinc-400/30 rounded-[var(--radius-control)] border px-3 py-2 text-sm font-medium disabled:opacity-50"
    [disabled]="!canGoPrevious()"
    type="button"
    (click)="goToPage(page() - 1)"
  >
    Previous
  </button>
  <span class="text-zinc-500 dark:text-zinc-400 text-sm">Page {{ page() }} of {{ pageCount() }}</span>
  <button
    class="ui-focus-ring border-zinc-500/30 dark:border-zinc-400/30 rounded-[var(--radius-control)] border px-3 py-2 text-sm font-medium disabled:opacity-50"
    [disabled]="!canGoNext()"
    type="button"
    (click)="goToPage(page() + 1)"
  >
    Next
  </button>
</nav>
