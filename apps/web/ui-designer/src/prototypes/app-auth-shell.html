<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>App Auth Shell</title>
    <link rel="stylesheet" href="/public/tailwind.css" />
  </head>
  <body class="min-h-screen bg-white text-zinc-950 dark:bg-zinc-950 dark:text-zinc-50">
    <header
      class="flex items-center justify-between border-b border-zinc-950/10 px-4 py-3 md:px-8 dark:border-white/10"
    >
      <a class="font-heading text-lg font-bold tracking-tight no-underline" href="/">Themis</a>
      <div class="flex items-center gap-2">
        <button
          type="button"
          class="rounded-md border border-zinc-950/10 px-3 py-1.5 text-sm font-medium dark:border-white/10"
        >
          EN
        </button>
        <button
          type="button"
          class="rounded-md border border-zinc-950/10 px-3 py-1.5 text-sm font-medium dark:border-white/10"
          aria-label="Toggle theme"
        >
          Theme
        </button>
      </div>
    </header>
    <main class="mx-auto flex w-full max-w-md flex-col gap-6 px-4 py-12 md:py-16">
      <article class="rounded-lg border border-zinc-950/10 bg-zinc-50 p-6 md:p-8 dark:border-white/10 dark:bg-zinc-900">
        <header class="mb-6 space-y-2">
          <p
            data-slot="kicker"
            class="font-mono text-xs font-semibold tracking-widest text-zinc-500 uppercase dark:text-zinc-400"
          >
            Account access
          </p>
          <h1 data-slot="title" class="font-heading text-[1.625rem] leading-tight font-bold tracking-[-0.025em]">
            Sign in
          </h1>
          <p data-slot="sub" class="text-[0.9375rem] leading-6 text-zinc-500 dark:text-zinc-400">
            Welcome back. Use your work email to access your Themis workspace.
          </p>
        </header>

        <form class="grid gap-5" novalidate>
          <div class="grid gap-1.5">
            <label for="sign-in-email" class="text-sm font-semibold"> Email </label>
            <input
              id="sign-in-email"
              autocomplete="email"
              name="email"
              placeholder="name@organization.com"
              type="email"
              class="rounded-md border border-zinc-950/10 bg-white px-3 py-2 text-sm dark:border-white/10 dark:bg-zinc-950"
            />
          </div>

          <div class="grid gap-1.5">
            <label for="sign-in-password" class="text-sm font-semibold"> Password </label>
            <input
              id="sign-in-password"
              autocomplete="current-password"
              name="password"
              placeholder="***************"
              type="password"
              class="rounded-md border border-zinc-950/10 bg-white px-3 py-2 text-sm dark:border-white/10 dark:bg-zinc-950"
            />
          </div>

          <button
            type="submit"
            class="min-h-11 w-full rounded-md bg-blue-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-blue-700 sm:w-auto"
          >
            Sign in
          </button>
        </form>

        <p class="mt-6 text-sm text-zinc-500 dark:text-zinc-400">New to Themis?</p>
        <a class="text-sm font-medium text-blue-600 no-underline dark:text-blue-500" href="#">Create an account</a>
      </article>
    </main>
  </body>
</html>
