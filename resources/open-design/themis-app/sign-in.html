<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in · Themis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light;

        /* Catalyst color tokens — Themis brand accent is Tailwind blue-600 */
        --color-bg: #ffffff;
        --color-panel: #fafafa;
        --color-panel-raised: #f4f4f5;
        --color-surface-muted-soft: color-mix(in srgb, #09090b 4%, #ffffff);
        --color-fg: #09090b;
        --color-muted-fg: #71717a;
        --color-border: rgb(9 9 11 / 0.10);
        --color-border-subtle: rgb(9 9 11 / 0.05);

        --color-accent: #2563eb;
        --color-accent-hover: #1d4ed8;
        --color-accent-strong: #1e40af;
        --color-accent-soft: rgb(37 99 235 / 0.10);
        --color-accent-fg: #ffffff;

        --color-success: #16a34a;
        --color-success-soft: rgb(22 163 74 / 0.14);
        --color-warning: #d97706;
        --color-warning-soft: rgb(217 119 6 / 0.14);
        --color-danger: #dc2626;
        --color-danger-soft: rgb(220 38 38 / 0.10);
        --color-danger-strong: #991b1b;

        --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        --font-heading: 'Manrope', 'Inter', sans-serif;
        --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;

        --radius-sm: 0.5rem;
        --radius-control: 0.5rem;
        --radius-panel: 0.75rem;
        --radius-lg: 1rem;
        --radius-pill: 9999px;

        --shadow-sm: 0 1px 2px rgb(9 9 11 / 0.06), 0 1px 1px rgb(9 9 11 / 0.04);
        --shadow-md: 0 4px 12px rgb(9 9 11 / 0.08), 0 2px 4px rgb(9 9 11 / 0.04);
        --shadow-lg: 0 12px 32px rgb(9 9 11 / 0.10), 0 4px 8px rgb(9 9 11 / 0.06);

        --motion-fast: 120ms ease;
        --motion-base: 180ms ease;
        --motion-slow: 260ms cubic-bezier(0.2, 0, 0, 1);
      }
      :root[data-theme='dark'] {
        color-scheme: dark;

        --color-bg: #09090b;
        --color-panel: #18181b;
        --color-panel-raised: #27272a;
        --color-surface-muted-soft: color-mix(in srgb, #fafafa 5%, #09090b);
        --color-fg: #fafafa;
        --color-muted-fg: #a1a1aa;
        --color-border: rgb(255 255 255 / 0.10);
        --color-border-subtle: rgb(255 255 255 / 0.05);

        --color-accent: #3b82f6;
        --color-accent-hover: #60a5fa;
        --color-accent-strong: #93c5fd;
        --color-accent-soft: rgb(59 130 246 / 0.18);
        --color-accent-fg: #ffffff;

        --color-success: #22c55e;
        --color-success-soft: rgb(34 197 94 / 0.18);
        --color-warning: #fbbf24;
        --color-warning-soft: rgb(251 191 36 / 0.18);
        --color-danger: #ef4444;
        --color-danger-soft: rgb(239 68 68 / 0.14);
        --color-danger-strong: #f87171;

        --shadow-sm: 0 1px 2px rgb(0 0 0 / 0.30), 0 1px 1px rgb(0 0 0 / 0.20);
        --shadow-md: 0 4px 12px rgb(0 0 0 / 0.40), 0 2px 4px rgb(0 0 0 / 0.20);
        --shadow-lg: 0 12px 32px rgb(0 0 0 / 0.50), 0 4px 8px rgb(0 0 0 / 0.30);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        background: var(--color-bg);
        color: var(--color-fg);
        font-family: var(--font-sans);
        font-size: 0.9375rem;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        min-height: 100vh;
      }
      img,
      svg {
        display: block;
        max-width: 100%;
      }
      a {
        color: var(--color-accent);
        text-decoration: none;
        transition: color var(--motion-fast);
      }
      a:hover {
        color: var(--color-accent-hover);
      }
      button {
        font: inherit;
        cursor: pointer;
        border: 0;
        background: none;
        padding: 0;
        color: inherit;
      }
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      p {
        margin: 0;
        text-wrap: pretty;
      }
      h1,
      h2,
      h3,
      h4 {
        margin: 0;
        text-wrap: balance;
        font-family: var(--font-heading);
        letter-spacing: -0.02em;
      }
      :focus-visible {
        outline: 2px solid var(--color-accent);
        outline-offset: 2px;
        border-radius: 4px;
      }

      .auth-shell {
        position: sticky;
        top: 0;
        z-index: 10;
        background: color-mix(in srgb, var(--color-bg) 92%, transparent);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--color-border-subtle);
      }
      .auth-shell__inner {
        max-width: 1240px;
        margin: 0 auto;
        padding: 14px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: var(--color-fg);
        font-family: var(--font-heading);
        font-weight: 700;
        font-size: 1.0625rem;
        letter-spacing: -0.02em;
      }
      .brand:hover {
        color: var(--color-fg);
      }
      .brand__mark {
        width: 28px;
        height: 28px;
        display: grid;
        place-items: center;
        background: var(--color-accent);
        color: var(--color-accent-fg);
        border-radius: var(--radius-sm);
      }
      .brand__mark svg {
        width: 16px;
        height: 16px;
      }
      .brand__name {
        font-weight: 700;
      }

      .auth-controls {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .lang {
        position: relative;
      }
      .lang__summary {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 12px;
        border-radius: var(--radius-control);
        border: 1px solid transparent;
        color: var(--color-fg);
        font-family: var(--font-mono);
        font-size: 0.8125rem;
        font-weight: 500;
        letter-spacing: 0.02em;
        cursor: pointer;
        list-style: none;
        transition:
          background var(--motion-fast),
          border-color var(--motion-fast);
      }
      .lang__summary::-webkit-details-marker {
        display: none;
      }
      .lang__summary:hover {
        background: var(--color-surface-muted-soft);
      }
      .lang[open] .lang__summary {
        border-color: var(--color-border-subtle);
        background: var(--color-panel);
      }
      .lang__summary svg {
        width: 12px;
        height: 12px;
        opacity: 0.6;
      }
      .lang__code {
        font-weight: 600;
      }
      .lang__menu {
        position: absolute;
        top: calc(100% + 6px);
        right: 0;
        min-width: 200px;
        background: var(--color-panel);
        border: 1px solid var(--color-border-subtle);
        border-radius: var(--radius-panel);
        box-shadow: var(--shadow-md);
        padding: 6px;
        list-style: none;
        margin: 0;
        z-index: 20;
      }
      .lang__item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 10px;
        border-radius: var(--radius-sm);
        cursor: pointer;
        color: var(--color-fg);
        font-size: 0.875rem;
        transition: background var(--motion-fast);
      }
      .lang__item:hover {
        background: var(--color-surface-muted-soft);
      }
      .lang__item--active {
        background: var(--color-accent-soft);
        color: var(--color-accent);
        font-weight: 600;
      }
      .lang__item code {
        font-family: var(--font-mono);
        font-size: 0.75rem;
        color: var(--color-muted-fg);
      }

      .theme-toggle {
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        border-radius: var(--radius-control);
        border: 1px solid transparent;
        color: var(--color-fg);
        transition:
          background var(--motion-fast),
          border-color var(--motion-fast);
      }
      .theme-toggle:hover {
        background: var(--color-surface-muted-soft);
      }
      .theme-toggle svg {
        width: 16px;
        height: 16px;
      }
      :root[data-theme='light'] .theme-toggle .icon-moon {
        display: none;
      }
      :root[data-theme='dark'] .theme-toggle .icon-sun {
        display: none;
      }

      .auth-main {
        min-height: calc(100vh - 64px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 48px 24px;
      }

      .auth-card {
        width: 100%;
        max-width: 440px;
        background: var(--color-panel);
        border: 1px solid var(--color-border-subtle);
        border-radius: var(--radius-panel);
        padding: 40px;
        box-shadow: var(--shadow-sm);
      }
      @media (max-width: 520px) {
        .auth-card {
          padding: 28px 22px;
          border-radius: var(--radius-control);
        }
        .auth-main {
          padding: 24px 16px;
        }
      }

      .auth-card__header {
        margin-bottom: 28px;
      }
      .auth-card__title {
        font-family: var(--font-heading);
        font-size: 1.625rem;
        font-weight: 700;
        letter-spacing: -0.025em;
        line-height: 1.2;
        margin-bottom: 8px;
      }
      .auth-card__sub {
        color: var(--color-muted-fg);
        font-size: 0.9375rem;
        line-height: 1.5;
      }

      .auth-alert {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 12px 14px;
        border-radius: var(--radius-control);
        margin-bottom: 20px;
        font-size: 0.875rem;
        line-height: 1.45;
      }
      .auth-alert svg {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
        margin-top: 2px;
      }
      .auth-alert--error {
        background: var(--color-danger-soft);
        color: var(--color-danger-strong);
        border: 1px solid color-mix(in srgb, var(--color-danger) 24%, transparent);
      }
      .auth-alert--success {
        background: var(--color-success-soft);
        color: var(--color-success);
        border: 1px solid color-mix(in srgb, var(--color-success) 24%, transparent);
      }

      .auth-form {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        position: relative;
      }
      .field__label {
        font-family: var(--font-mono);
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--color-muted-fg);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .field__control {
        position: relative;
      }
      .input {
        width: 100%;
        min-height: 44px;
        padding: 0 14px;
        background: var(--color-panel);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-control);
        color: var(--color-fg);
        font-size: 0.9375rem;
        line-height: 1.4;
        transition:
          border-color var(--motion-fast),
          box-shadow var(--motion-fast);
      }
      .input::placeholder {
        color: var(--color-muted-fg);
        opacity: 0.7;
      }
      .input:hover {
        border-color: color-mix(in srgb, var(--color-fg) 20%, var(--color-border));
      }
      .input:focus {
        outline: none;
        border-color: var(--color-accent);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--color-accent) 18%, transparent);
      }
      .input:disabled {
        background: var(--color-surface-muted-soft);
        cursor: not-allowed;
        opacity: 0.7;
      }
      .input--error {
        border-color: var(--color-danger);
      }
      .input--error:focus {
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--color-danger) 18%, transparent);
      }
      .field__hint {
        font-size: 0.8125rem;
        color: var(--color-muted-fg);
        line-height: 1.45;
      }
      .field__error {
        font-size: 0.8125rem;
        color: var(--color-danger);
        display: none;
        align-items: center;
        gap: 6px;
      }
      .field__error svg {
        width: 12px;
        height: 12px;
        flex-shrink: 0;
      }
      .field--invalid .field__error {
        display: flex;
      }

      .field__suffix {
        position: absolute;
        top: 50%;
        right: 8px;
        transform: translateY(-50%);
        padding: 6px 8px;
        border-radius: var(--radius-sm);
        color: var(--color-muted-fg);
        font-family: var(--font-mono);
        font-size: 0.6875rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .field__suffix:hover {
        color: var(--color-fg);
        background: var(--color-surface-muted-soft);
      }
      .input--with-suffix {
        padding-right: 64px;
      }

      .checkbox {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
        font-size: 0.875rem;
        color: var(--color-fg);
      }
      .checkbox input[type='checkbox'] {
        appearance: none;
        -webkit-appearance: none;
        width: 18px;
        height: 18px;
        border: 1px solid var(--color-border);
        border-radius: var(--radius-sm);
        background: var(--color-panel);
        cursor: pointer;
        display: grid;
        place-items: center;
        transition:
          background var(--motion-fast),
          border-color var(--motion-fast);
      }
      .checkbox input[type='checkbox']:hover {
        border-color: var(--color-accent);
      }
      .checkbox input[type='checkbox']:checked {
        background: var(--color-accent);
        border-color: var(--color-accent);
      }
      .checkbox input[type='checkbox']:checked::after {
        content: '';
        width: 10px;
        height: 10px;
        background: var(--color-accent-fg);
        clip-path: polygon(14% 44%, 0 60%, 50% 100%, 100% 16%, 80% 0, 43% 62%);
      }
      .checkbox input[type='checkbox']:focus-visible {
        outline: 2px solid var(--color-accent);
        outline-offset: 2px;
      }

      .form-options {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
      }
      .form-options .link {
        font-size: 0.875rem;
        color: var(--color-accent);
        font-weight: 500;
      }
      .form-options .link:hover {
        color: var(--color-accent-hover);
        text-decoration: underline;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 44px;
        padding: 0 20px;
        border-radius: var(--radius-control);
        font-family: var(--font-sans);
        font-size: 0.9375rem;
        font-weight: 600;
        letter-spacing: -0.005em;
        transition:
          background var(--motion-fast),
          border-color var(--motion-fast),
          color var(--motion-fast),
          transform var(--motion-fast);
        cursor: pointer;
        white-space: nowrap;
      }
      .btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .btn:active:not(:disabled) {
        transform: translateY(1px);
      }
      .btn--primary {
        background: var(--color-accent);
        color: var(--color-accent-fg);
        border: 1px solid var(--color-accent);
      }
      .btn--primary:hover:not(:disabled) {
        background: var(--color-accent-hover);
        border-color: var(--color-accent-hover);
      }
      .btn--primary:focus-visible {
        outline: 2px solid var(--color-accent);
        outline-offset: 2px;
      }
      .btn--block {
        width: 100%;
      }
      .btn__spinner {
        width: 14px;
        height: 14px;
        border: 2px solid currentColor;
        border-right-color: transparent;
        border-radius: 50%;
        animation: tm-spin 0.7s linear infinite;
        display: none;
      }
      .btn--loading .btn__spinner {
        display: block;
      }
      .btn--loading .btn__label {
        opacity: 0.85;
      }
      @keyframes tm-spin {
        to {
          transform: rotate(360deg);
        }
      }

      .auth-card__footer {
        margin-top: 24px;
        padding-top: 20px;
        border-top: 1px solid var(--color-border-subtle);
        text-align: center;
        color: var(--color-muted-fg);
        font-size: 0.875rem;
      }
      .auth-card__footer a {
        font-weight: 500;
      }

      .divider {
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--color-muted-fg);
        font-size: 0.75rem;
        font-family: var(--font-mono);
        letter-spacing: 0.04em;
        text-transform: uppercase;
        margin: 4px 0;
      }
      .divider::before,
      .divider::after {
        content: '';
        flex: 1;
        height: 1px;
        background: var(--color-border-subtle);
      }

      .provider-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        min-height: 44px;
        padding: 0 16px;
        background: var(--color-panel);
        color: var(--color-fg);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-control);
        font-size: 0.9375rem;
        font-weight: 500;
        width: 100%;
        transition:
          border-color var(--motion-fast),
          background var(--motion-fast);
        cursor: pointer;
      }
      .provider-btn:hover {
        border-color: var(--color-fg);
        background: var(--color-surface-muted-soft);
      }
      .provider-btn svg {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
      }
      .provider-btn:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      .provider-btn:disabled:hover {
        border-color: var(--color-border);
        background: var(--color-panel);
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body class="auth-screen" data-screen-label="01 Sign in">
    <header class="auth-shell">
      <div class="auth-shell__inner">
        <a href="index.html" class="brand" aria-label="Themis home">
          <span class="brand__mark" aria-hidden="true">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M5 9h14" />
              <path d="M12 9V3" />
              <circle cx="5" cy="12" r="2.2" fill="currentColor" />
              <circle cx="19" cy="12" r="2.2" fill="currentColor" />
              <path d="M9 21h6" />
            </svg>
          </span>
          <span class="brand__name">Themis</span>
        </a>

        <div class="auth-controls">
          <details class="lang" id="lang">
            <summary class="lang__summary" aria-label="Language">
              <span class="lang__code">EN</span>
              <svg
                viewBox="0 0 12 12"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M3 4.5l3 3 3-3" />
              </svg>
            </summary>
            <ul class="lang__menu" role="listbox">
              <li class="lang__item lang__item--active" data-lang="EN" role="option" aria-selected="true">
                <span>English</span><code>EN</code>
              </li>
              <li class="lang__item" data-lang="ES" role="option"><span>Español</span><code>ES</code></li>
              <li class="lang__item" data-lang="PT-BR" role="option"><span>Português (Brasil)</span><code>PT</code></li>
              <li class="lang__item" data-lang="JA" role="option"><span>日本語</span><code>JA</code></li>
              <li class="lang__item" data-lang="DE" role="option"><span>Deutsch</span><code>DE</code></li>
              <li class="lang__item" data-lang="ZH" role="option"><span>中文</span><code>ZH</code></li>
            </ul>
          </details>

          <button class="theme-toggle" id="theme-toggle" aria-label="Toggle light/dark theme">
            <svg
              class="icon-sun"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"
              />
            </svg>
            <svg
              class="icon-moon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main class="auth-main">
      <div class="auth-card" data-od-id="sign-in">
        <header class="auth-card__header">
          <h1 class="auth-card__title">Sign in</h1>
          <p class="auth-card__sub">Welcome back. Use your work email to access your Themis workspace.</p>
        </header>

        <div class="auth-alert auth-alert--error" id="alert" hidden role="alert">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="10" />
            <line x1="12" y1="8" x2="12" y2="12" />
            <line x1="12" y1="16" x2="12.01" y2="16" />
          </svg>
          <span id="alert-msg"></span>
        </div>

        <form class="auth-form" id="signin-form" novalidate>
          <div class="field" data-field="email">
            <label class="field__label" for="email">Email</label>
            <div class="field__control">
              <input
                class="input"
                id="email"
                name="email"
                type="email"
                autocomplete="email"
                placeholder="you@company.com"
                required
              />
            </div>
            <div class="field__error">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <circle cx="12" cy="12" r="10" />
                <line x1="12" y1="8" x2="12" y2="12" />
                <line x1="12" y1="16" x2="12.01" y2="16" />
              </svg>
              <span></span>
            </div>
          </div>

          <div class="field" data-field="password">
            <label class="field__label" for="password">Password</label>
            <div class="field__control">
              <input
                class="input input--with-suffix"
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                placeholder="••••••••"
                required
              />
              <button type="button" class="field__suffix" id="toggle-password" aria-label="Show password">Show</button>
            </div>
            <div class="field__error">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <circle cx="12" cy="12" r="10" />
                <line x1="12" y1="8" x2="12" y2="12" />
                <line x1="12" y1="16" x2="12.01" y2="16" />
              </svg>
              <span></span>
            </div>
          </div>

          <div class="form-options">
            <label class="checkbox">
              <input type="checkbox" name="remember" />
              <span>Remember this device</span>
            </label>
            <a href="recover-password.html" class="link">Forgot password?</a>
          </div>

          <button type="submit" class="btn btn--primary btn--block" id="submit">
            <span class="btn__spinner" aria-hidden="true"></span>
            <span class="btn__label">Sign in</span>
          </button>
        </form>

        <footer class="auth-card__footer">New to Themis? <a href="sign-up.html">Create an account</a></footer>
      </div>
    </main>

    <script>
      (function () {
        'use strict';

        const root = document.documentElement;
        const themeBtn = document.getElementById('theme-toggle');
        const storedTheme = localStorage.getItem('tm-theme');
        const sysPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const initialTheme = storedTheme || (sysPrefersDark ? 'dark' : 'light');
        root.setAttribute('data-theme', initialTheme);

        themeBtn.addEventListener('click', () => {
          const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
          root.setAttribute('data-theme', next);
          localStorage.setItem('tm-theme', next);
        });

        const langDetails = document.getElementById('lang');
        const langCode = langDetails.querySelector('.lang__code');
        const langItems = langDetails.querySelectorAll('.lang__item');
        const storedLang = localStorage.getItem('tm-lang') || 'EN';

        function applyLang(code) {
          langCode.textContent = code;
          langItems.forEach((li) => {
            const active = li.dataset.lang === code;
            li.classList.toggle('lang__item--active', active);
            li.setAttribute('aria-selected', active ? 'true' : 'false');
          });
          localStorage.setItem('tm-lang', code);
        }
        applyLang(storedLang);

        langItems.forEach((li) => {
          li.addEventListener('click', (e) => {
            e.preventDefault();
            applyLang(li.dataset.lang);
            langDetails.removeAttribute('open');
          });
        });

        document.addEventListener('click', (e) => {
          if (langDetails.open && !langDetails.contains(e.target)) langDetails.removeAttribute('open');
        });

        const pwInput = document.getElementById('password');
        const pwToggle = document.getElementById('toggle-password');
        pwToggle.addEventListener('click', () => {
          const isPw = pwInput.type === 'password';
          pwInput.type = isPw ? 'text' : 'password';
          pwToggle.textContent = isPw ? 'Hide' : 'Show';
          pwInput.focus();
        });

        const form = document.getElementById('signin-form');
        const alert = document.getElementById('alert');
        const alertMsg = document.getElementById('alert-msg');
        const submit = document.getElementById('submit');

        function setFieldError(fieldName, message) {
          const field = form.querySelector(`[data-field="${fieldName}"]`);
          if (!field) return;
          if (message) {
            field.classList.add('field--invalid');
            field.querySelector('.input').classList.add('input--error');
            field.querySelector('.field__error span').textContent = message;
          } else {
            field.classList.remove('field--invalid');
            field.querySelector('.input').classList.remove('input--error');
          }
        }

        function showAlert(message) {
          alertMsg.textContent = message;
          alert.hidden = false;
        }
        function hideAlert() {
          alert.hidden = true;
        }

        function isEmail(value) {
          return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
        }

        form.querySelectorAll('.input').forEach((input) => {
          input.addEventListener('input', () => {
            const field = input.closest('.field');
            field.classList.remove('field--invalid');
            input.classList.remove('input--error');
            hideAlert();
          });
        });

        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          let valid = true;
          const email = form.email.value.trim();
          const password = form.password.value;

          if (!email) {
            setFieldError('email', 'Enter your email address.');
            valid = false;
          } else if (!isEmail(email)) {
            setFieldError('email', 'Enter a valid email address (e.g. you@company.com).');
            valid = false;
          }

          if (!password) {
            setFieldError('password', 'Enter your password.');
            valid = false;
          }

          if (!valid) {
            hideAlert();
            return;
          }

          submit.classList.add('btn--loading');
          submit.disabled = true;
          hideAlert();

          await new Promise((r) => setTimeout(r, 900));

          const ok = /^[^@]+@themis\.dev$/i.test(email) && password.length >= 6;
          submit.classList.remove('btn--loading');
          submit.disabled = false;

          if (ok) {
            submit.querySelector('.btn__label').textContent = 'Signed in — redirecting…';
            submit.disabled = true;
          } else {
            showAlert('Email or password is incorrect. Try again or recover your account.');
            setFieldError('password', ' ');
            form.password.focus();
            form.password.select();
          }
        });
      })();
    </script>
  </body>
</html>
