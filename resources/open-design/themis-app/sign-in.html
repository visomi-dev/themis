<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in · Themis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: ['class', '[data-theme="dark"]'],
        theme: {
          extend: {
            colors: {
              bg: 'var(--color-bg)',
              surface: 'var(--color-panel)',
              'surface-2': 'var(--color-panel)',
              'surface-3': 'var(--color-panel-raised)',
              fg: 'var(--color-fg)',
              muted: 'var(--color-muted-fg)',
              border: 'var(--color-border)',
              'border-subtle': 'var(--color-border-subtle)',
              accent: 'var(--color-accent)',
              'accent-fg': 'var(--color-accent-fg)',
              success: '#16a34a',
              warning: '#d97706',
              danger: 'var(--color-danger)',
            },
            accentColor: {
              primary: 'var(--color-accent)',
            },
            fontFamily: {
              sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
              display: ['Manrope', 'Inter', 'system-ui', 'sans-serif'],
              mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
            },
            borderRadius: {
              sm: '6px',
              DEFAULT: '8px',
              md: '12px',
              full: '9999px',
            },
            boxShadow: {
              sm: '0 1px 2px rgba(26,27,32,.06),0 1px 3px rgba(26,27,32,.04)',
              md: '0 4px 12px rgba(26,27,32,.08),0 2px 4px rgba(26,27,32,.04)',
            },
          },
        },
      };
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');

      :root {
        color-scheme: light;
        --color-bg: #ffffff;
        --color-panel: #fafafa;
        --color-panel-raised: #f4f4f5;
        --color-fg: #09090b;
        --color-muted-fg: #71717a;
        --color-accent: #2563eb;
        --color-accent-fg: #ffffff;
        --color-danger: #dc2626;
        --color-ring: #2563eb;
        --color-border: rgb(9 9 11 / 0.10);
        --color-border-subtle: rgb(9 9 11 / 0.05);
      }
      [data-theme='dark'] {
        color-scheme: dark;
        --color-bg: #09090b;
        --color-panel: #18181b;
        --color-panel-raised: #27272a;
        --color-fg: #fafafa;
        --color-muted-fg: #a1a1aa;
        --color-accent: #3b82f6;
        --color-accent-fg: #ffffff;
        --color-danger: #ef4444;
        --color-ring: #3b82f6;
        --color-border: rgb(255 255 255 / 0.10);
        --color-border-subtle: rgb(255 255 255 / 0.05);
      }

      /* Minimal state classes for JS toggles — all visual styling via Tailwind */
      .field--invalid input,
      .input--error { @apply border-danger; }
      .field--invalid input:focus,
      .input--error:focus { box-shadow: 0 0 0 3px color-mix(in srgb, var(--color-danger) 18%, transparent); }
      .field--invalid .field__error { @apply flex; }
      .btn--loading .btn__spinner { @apply block; }
      .btn--loading .btn__label { @apply opacity-85; }
      .auth-success { display: none; }
      .auth-success.is-active { @apply flex; }
      .lang__summary::-webkit-details-marker { display: none; }
      [data-theme='light'] .icon-moon { @apply hidden; }
      [data-theme='dark'] .icon-sun { @apply hidden; }
      .lang[open] .lang__summary { @apply border-border-subtle bg-surface; }

      @keyframes tm-spin { to { transform: rotate(360deg); } }
      .btn__spinner { animation: tm-spin 0.7s linear infinite; }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
      }
    </style>
  </head>
  <body class="min-h-screen bg-bg font-sans text-fg antialiased" data-screen-label="01 Sign in">
    <header class="sticky top-0 z-10 bg-bg/85 backdrop-blur-md">
      <div class="mx-auto flex max-w-7xl items-center justify-between gap-4 px-6 py-3.5">
        <a href="index.html" class="inline-flex items-center gap-2.5 text-fg" aria-label="Themis home">
          <span class="grid h-7 w-7 place-items-center rounded-md bg-accent text-accent-fg" aria-hidden="true">
            <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 9h14" /><path d="M12 9V3" /><circle cx="5" cy="12" r="2.2" fill="currentColor" /><circle cx="19" cy="12" r="2.2" fill="currentColor" /><path d="M9 21h6" />
            </svg>
          </span>
          <span class="font-display text-[1.0625rem] font-bold tracking-tight">Themis</span>
        </a>
        <div class="flex items-center gap-2">
          <details id="lang" class="relative">
            <summary class="lang__summary inline-flex cursor-pointer list-none items-center gap-1.5 rounded px-3 py-2 font-mono text-xs font-medium text-fg transition-colors hover:bg-surface-2">
              <span class="lang__code font-semibold">EN</span>
              <svg class="h-3 w-3 opacity-60" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 4.5l3 3 3-3" />
              </svg>
            </summary>
            <ul class="absolute right-0 top-[calc(100%+6px)] z-20 m-0 min-w-[200px] list-none rounded-md border border-border-subtle bg-surface p-1.5 shadow-md" role="listbox">
              <li class="lang__item lang__item--active flex cursor-pointer items-center justify-between rounded-sm px-2.5 py-2 text-sm text-fg transition-colors hover:bg-surface-2" data-lang="EN" role="option" aria-selected="true">
                <span>English</span><code class="font-mono text-xs text-muted">EN</code>
              </li>
              <li class="lang__item flex cursor-pointer items-center justify-between rounded-sm px-2.5 py-2 text-sm text-fg transition-colors hover:bg-surface-2" data-lang="ES" role="option"><span>Español</span><code class="font-mono text-xs text-muted">ES</code></li>
              <li class="lang__item flex cursor-pointer items-center justify-between rounded-sm px-2.5 py-2 text-sm text-fg transition-colors hover:bg-surface-2" data-lang="PT-BR" role="option"><span>Português (Brasil)</span><code class="font-mono text-xs text-muted">PT</code></li>
              <li class="lang__item flex cursor-pointer items-center justify-between rounded-sm px-2.5 py-2 text-sm text-fg transition-colors hover:bg-surface-2" data-lang="JA" role="option"><span>日本語</span><code class="font-mono text-xs text-muted">JA</code></li>
              <li class="lang__item flex cursor-pointer items-center justify-between rounded-sm px-2.5 py-2 text-sm text-fg transition-colors hover:bg-surface-2" data-lang="DE" role="option"><span>Deutsch</span><code class="font-mono text-xs text-muted">DE</code></li>
              <li class="lang__item flex cursor-pointer items-center justify-between rounded-sm px-2.5 py-2 text-sm text-fg transition-colors hover:bg-surface-2" data-lang="ZH" role="option"><span>中文</span><code class="font-mono text-xs text-muted">ZH</code></li>
            </ul>
          </details>
          <button id="theme-toggle" type="button" aria-label="Toggle light/dark theme" class="grid h-[38px] w-[38px] place-items-center rounded text-fg transition-colors hover:bg-surface-2">
            <svg class="icon-sun h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
            </svg>
            <svg class="icon-moon h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main class="flex min-h-[calc(100vh-64px)] items-center justify-center px-6 py-12 max-[520px]:px-4">
      <div class="w-full max-w-[440px] rounded-md border border-border-subtle bg-surface p-10 shadow-sm max-[520px]:rounded max-[520px]:p-7" data-od-id="sign-in">
        <header class="mb-7">
          <h1 class="mb-2 font-display text-[1.625rem] font-bold leading-tight tracking-[-0.025em]">Sign in</h1>
          <p class="text-[0.9375rem] leading-relaxed text-muted">Welcome back. Use your work email to access your Themis workspace.</p>
        </header>

        <form id="signin-form" novalidate class="flex flex-col gap-4">
          <div class="field flex flex-col gap-1.5" data-field="email">
            <label for="email" class="font-mono text-xs font-semibold uppercase tracking-wider text-muted">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="you@company.com" required
              class="h-11 w-full rounded border border-border bg-surface px-3.5 text-[0.9375rem] leading-tight text-fg transition placeholder:text-muted hover:border-fg/20 focus:border-accent focus:outline-none focus:ring-[3px] focus:ring-accent/20" />
            <div class="field__error hidden items-center gap-1.5 text-[0.8125rem] text-danger">
              <svg class="h-3 w-3 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="10" /><line x1="12" y1="8" x2="12" y2="12" /><line x1="12" y1="16" x2="12.01" y2="16" />
              </svg>
              <span></span>
            </div>
          </div>

          <div class="field flex flex-col gap-1.5" data-field="password">
            <label for="password" class="font-mono text-xs font-semibold uppercase tracking-wider text-muted">Password</label>
            <div class="relative">
              <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required
                class="h-11 w-full rounded border border-border bg-surface px-3.5 pr-16 text-[0.9375rem] leading-tight text-fg transition placeholder:text-muted hover:border-fg/20 focus:border-accent focus:outline-none focus:ring-[3px] focus:ring-accent/20" />
              <button type="button" id="toggle-password" aria-label="Show password" class="absolute right-2 top-1/2 -translate-y-1/2 rounded-sm px-2 py-1.5 font-mono text-[0.6875rem] uppercase tracking-wider text-muted transition-colors hover:bg-surface-2 hover:text-fg">Show</button>
            </div>
            <div class="field__error hidden items-center gap-1.5 text-[0.8125rem] text-danger">
              <svg class="h-3 w-3 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="10" /><line x1="12" y1="8" x2="12" y2="12" /><line x1="12" y1="16" x2="12.01" y2="16" />
              </svg>
              <span></span>
            </div>
          </div>

          <div class="flex items-center justify-between pt-1">
            <label class="inline-flex cursor-pointer items-center gap-2 text-[0.875rem] text-fg">
              <input type="checkbox" name="remember" class="h-4 w-4 rounded border-border text-accent accent-primary focus:ring-accent" />
              <span>Remember this device</span>
            </label>
            <a href="recover-password.html" class="text-[0.875rem] font-medium text-accent transition-colors">Forgot password?</a>
          </div>

          <button type="submit" id="submit"
            class="relative inline-flex h-11 w-full items-center justify-center gap-2 rounded bg-accent px-5 text-[0.9375rem] font-semibold tracking-tight text-accent-fg transition hover:bg-[color-mix(in_srgb,var(--color-accent)_88%,black)] disabled:cursor-not-allowed disabled:opacity-60">
            <span class="btn__spinner hidden h-3.5 w-3.5 rounded-full border-2 border-accent-fg border-r-transparent"></span>
            <span class="btn__label">Sign in</span>
          </button>

          <div id="alert" hidden role="alert" class="flex items-start gap-2.5 rounded border border-danger/30 bg-[color-mix(in_srgb,var(--color-danger)_12%,transparent)] px-3.5 py-3 text-[0.875rem] leading-snug text-danger font-semibold">
            <svg class="mt-0.5 h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="10" /><line x1="12" y1="8" x2="12" y2="12" /><line x1="12" y1="16" x2="12.01" y2="16" />
            </svg>
            <span id="alert-msg"></span>
          </div>
        </form>

        <footer class="mt-6 border-t border-border-subtle pt-5 text-center text-[0.875rem] text-muted">
          New to Themis? <a href="sign-up.html" class="font-medium text-accent">Create an account</a>
        </footer>
      </div>
    </main>

    <script>
      (function () {
        'use strict';

        const root = document.documentElement;
        const themeBtn = document.getElementById('theme-toggle');
        const storedTheme = localStorage.getItem('tm-theme');
        const sysPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const initialTheme = storedTheme || (sysPrefersDark ? 'dark' : 'light');
        root.setAttribute('data-theme', initialTheme);

        themeBtn.addEventListener('click', () => {
          const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
          root.setAttribute('data-theme', next);
          localStorage.setItem('tm-theme', next);
        });

        const langDetails = document.getElementById('lang');
        const langCode = langDetails.querySelector('.lang__code');
        const langItems = langDetails.querySelectorAll('.lang__item');
        const storedLang = localStorage.getItem('tm-lang') || 'EN';

        function applyLang(code) {
          langCode.textContent = code;
          langItems.forEach((li) => {
            const active = li.dataset.lang === code;
            li.classList.toggle('lang__item--active', active);
            li.setAttribute('aria-selected', active ? 'true' : 'false');
          });
          localStorage.setItem('tm-lang', code);
        }
        applyLang(storedLang);

        langItems.forEach((li) => {
          li.addEventListener('click', (e) => {
            e.preventDefault();
            applyLang(li.dataset.lang);
            langDetails.removeAttribute('open');
          });
        });

        document.addEventListener('click', (e) => {
          if (langDetails.open && !langDetails.contains(e.target)) langDetails.removeAttribute('open');
        });

        const pwInput = document.getElementById('password');
        const pwToggle = document.getElementById('toggle-password');
        pwToggle.addEventListener('click', () => {
          const isPw = pwInput.type === 'password';
          pwInput.type = isPw ? 'text' : 'password';
          pwToggle.textContent = isPw ? 'Hide' : 'Show';
          pwInput.focus();
        });

        const form = document.getElementById('signin-form');
        const alert = document.getElementById('alert');
        const alertMsg = document.getElementById('alert-msg');
        const submit = document.getElementById('submit');

        function setFieldError(fieldName, message) {
          const field = form.querySelector(`[data-field="${fieldName}"]`);
          if (!field) return;
          if (message) {
            field.classList.add('field--invalid');
            field.querySelector('.field__error span').textContent = message;
          } else {
            field.classList.remove('field--invalid');
          }
        }

        function showAlert(message) {
          alertMsg.textContent = message;
          alert.hidden = false;
        }
        function hideAlert() {
          alert.hidden = true;
        }

        function isEmail(value) {
          return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
        }

        form.querySelectorAll('input').forEach((input) => {
          input.addEventListener('input', () => {
            const field = input.closest('.field');
            field.classList.remove('field--invalid');
            hideAlert();
          });
        });

        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          let valid = true;
          const email = form.email.value.trim();
          const password = form.password.value;

          if (!email) {
            setFieldError('email', 'Enter your email address.');
            valid = false;
          } else if (!isEmail(email)) {
            setFieldError('email', 'Enter a valid email address (e.g. you@company.com).');
            valid = false;
          }

          if (!password) {
            setFieldError('password', 'Enter your password.');
            valid = false;
          }

          if (!valid) {
            hideAlert();
            return;
          }

          submit.classList.add('btn--loading');
          submit.disabled = true;
          hideAlert();

          await new Promise((r) => setTimeout(r, 900));

          const ok = /^[^@]+@themis\.dev$/i.test(email) && password.length >= 6;
          submit.classList.remove('btn--loading');
          submit.disabled = false;

          if (ok) {
            submit.querySelector('.btn__label').textContent = 'Signed in — redirecting…';
            submit.disabled = true;
          } else {
            showAlert('Email or password is incorrect. Try again or recover your account.');
            setFieldError('password', ' ');
            form.password.focus();
            form.password.select();
          }
        });
      })();
    </script>
  </body>
</html>
